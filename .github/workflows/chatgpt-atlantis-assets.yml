name: chatgpt-yonaguni-fullview
on:
  push:
    branches:
      - chatgpt-atlantis-assets-20261006
jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download full Yonaguni panorama
        shell: bash
        run: |
          mkdir -p assets
          curl -fL --retry 3 'https://upload.wikimedia.org/wikipedia/commons/a/a5/Yonaguni_Monument_Banner_02.jpg' -o assets/yonaguni_full_panorama.jpg
          ls -lh assets
          file assets/yonaguni_full_panorama.jpg
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: yonaguni-full-panorama
          path: assets/yonaguni_full_panorama.jpg
          if-no-files-found: error
          retention-days: 7
