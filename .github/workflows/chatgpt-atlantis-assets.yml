name: chatgpt-yonaguni-overview
on:
  push:
    branches:
      - chatgpt-atlantis-assets-20261006
jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download overview
        shell: bash
        run: |
          mkdir -p assets
          curl -fL --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Yonaguni_Monument_DSC02871_(12737283303).jpg' -o assets/yonaguni_overview.jpg
          ls -lh assets
          file assets/yonaguni_overview.jpg
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: yonaguni-overview
          path: assets
          if-no-files-found: error
          retention-days: 7
