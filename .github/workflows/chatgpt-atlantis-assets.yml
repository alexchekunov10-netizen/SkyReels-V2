name: chatgpt-yonaguni-model
on:
  push:
    branches:
      - chatgpt-atlantis-assets-20261006
jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Yonaguni model image
        shell: bash
        run: |
          mkdir -p assets
          curl -fL --retry 3 'https://live.staticflickr.com/2858/10485323185_5231d4e822_b.jpg' -o assets/yonaguni_model_full.jpg
          ls -lh assets
          file assets/yonaguni_model_full.jpg
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: yonaguni-model
          path: assets/yonaguni_model_full.jpg
          if-no-files-found: error
          retention-days: 7
