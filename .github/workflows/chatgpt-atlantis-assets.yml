name: chatgpt-atlantis-assets
on:
  push:
    branches:
      - chatgpt-atlantis-assets-20261006

jobs:
  download-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Atlantis reel media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets

          curl -fL --retry 3 --retry-delay 2 \
            'https://dnznrvs05pmza.cloudfront.net/text_to_speech/83e71766-8315-4988-b3fd-d13234175bf2/_________________________.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNmZiZmZlMjZhZGFiOWU4OCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTQ3NzQxNH0._KNTR9frUpU3yYOywrTTWnTvJOJ0z2Mie2IhtLejQbY' \
            -o assets/atlantis_voice.mp3

          curl -fL --retry 3 --retry-delay 2 \
            'https://videos.pexels.com/video-files/17629657/17629657-uhd_3840_2160_25fps.mp4' \
            -o assets/sahara_source_4k.mp4

          echo '--- sizes ---'
          ls -lh assets
          echo '--- types ---'
          file assets/*
          echo '--- media probe ---'

      - name: Upload media pack
        uses: actions/upload-artifact@v4
        with:
          name: atlantis-reel-media
          path: assets
          if-no-files-found: error
          retention-days: 7
