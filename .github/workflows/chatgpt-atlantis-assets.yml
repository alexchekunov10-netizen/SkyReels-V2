name: chatgpt-yonaguni-assets
on:
  push:
    branches:
      - chatgpt-atlantis-assets-20261006

jobs:
  download-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download verified Yonaguni source images
        shell: bash
        run: |
          set -u
          mkdir -p assets
          getfile () {
            url="$1"
            out="$2"
            if curl -fL --retry 3 --retry-delay 2 "$url" -o "assets/$out"; then
              echo "OK $out"
            else
              echo "FAILED $out" >&2
              rm -f "assets/$out"
            fi
          }

          getfile 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Yonaguni_Monument_Main_Terrace_Stair.jpg' '01_main_terrace_stair.jpg'
          getfile 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Yonaguni_Monument_Main_Terrace.jpg' '02_main_terrace.jpg'
          getfile 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Yonaguni_Monument_Twin_Megaliths_with_Divers.jpg' '03_twin_megaliths_with_divers.jpg'
          getfile 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Yonaguni_Monument_Water_Trench.jpg' '04_water_trench.jpg'
          getfile 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Yonaguni_Monument_Loop_Road_and_Retaining_Wall.jpg' '05_loop_road_retaining_wall.jpg'
          getfile 'https://commons.wikimedia.org/wiki/Special:Redirect/file/At_the_Yonaguni_Monument.jpg' '06_right_angle_features.jpg'

          cat > assets/SOURCES.txt <<'EOF'
01 Main Terrace Stair — Melkov — CC0
02 Main Terrace — Melkov — CC0
03 Twin Megaliths with Divers — Melkov — CC0
04 Water Trench — Melkov — CC0
05 Loop Road and Retaining Wall — Melkov — CC0
06 Right-angle features — Melkov — CC0
EOF

          echo '--- downloaded files ---'
          ls -lh assets
          echo '--- file types ---'
          file assets/*

      - name: Upload source pack
        uses: actions/upload-artifact@v4
        with:
          name: yonaguni-source-assets
          path: assets
          if-no-files-found: error
          retention-days: 7
